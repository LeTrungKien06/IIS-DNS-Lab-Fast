<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IIS DNS Lab · Dynamic Fast Deploy</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f5fa;color:#172740;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:900px;margin:28px auto;padding:0 20px 40px}
h1{font-size:30px;margin:4px 0 8px}
.muted{color:#607089}
.card{background:#fff;border:1px solid #d9e3ef;border-radius:16px;padding:24px;margin-top:18px;box-shadow:0 8px 28px rgba(22,55,95,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;font-weight:650;margin:12px 0 5px}
input,textarea,button{font:inherit}
input[type=text],input[type=number],textarea{width:100%;border:1px solid #b8c7da;border-radius:8px;padding:10px 12px;color:#172740;background:#fff}
textarea{min-height:190px;resize:vertical;line-height:1.55}
.protocol{display:grid;grid-template-columns:auto 1fr 130px;align-items:center;gap:10px;padding:10px 0}
.protocol input[type=checkbox]{width:18px;height:18px}
button{border:0;border-radius:9px;padding:13px 18px;cursor:pointer;font-weight:750}
button.primary{background:#107c41;color:#fff;font-size:17px;width:100%;margin-top:18px}
button.secondary{background:#e8effa;color:#164783}
button:disabled{opacity:.55;cursor:wait}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf3fc;border-radius:10px;padding:15px;min-height:72px;font:14px/1.55 ui-monospace,Consolas,monospace}
.ok{color:#17613f}.error{color:#a52323}
.tip{background:#fff9df;border:1px solid #f0de91;border-radius:10px;padding:11px 13px;margin-top:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.protocol{grid-template-columns:auto 1fr 110px}}
</style>
</head>
<body>
<main>
<div class="muted">WINDOWS SERVER LAB · FAST MODE</div>
<h1>Dynamic Fast Deploy</h1>
<div class="muted">Chỉ nhập những giá trị thay đổi theo đề. DNS, SSL, Firewall, IIS bindings, AppPool và client Edge được tự động hóa.</div>

<form id="deploy" class="card">
<div class="grid">
<div>
<label>Tên website / IIS site</label>
<input id="site" name="site" type="text" value="thi" required pattern="[A-Za-z0-9._-]{1,64}">
</div>
<div>
<label>Hostname</label>
<input id="hostname" name="hostname" type="text" value="www.hahahihi.vn" placeholder="Để trống nếu đề chỉ dùng IP">
</div>
</div>

<div class="grid">
<div>
<label>IP website</label>
<input id="ip" name="ip" type="text" value="23.23.23.23" required>
</div>
<div>
<label>Prefix</label>
<input id="prefix" name="prefix" type="number" value="24" min="8" max="30" required>
</div>
</div>

<div style="margin-top:14px">
<div class="protocol">
<input id="httpEnabled" type="checkbox" checked>
<label for="httpEnabled" style="margin:0">HTTP</label>
<input id="httpPort" type="number" value="80" min="1" max="65535">
</div>

<div class="protocol">
<input id="httpsEnabled" type="checkbox" checked>
<label for="httpsEnabled" style="margin:0">HTTPS</label>
<input id="httpsPort" type="number" value="443" min="1" max="65535">
</div>
</div>

<label>Tiêu đề trang</label>
<input id="title" type="text" value="Website của tôi" placeholder="Có thể để trống">

<label>Nội dung trang web</label>
<textarea id="content">Xin chào!

Đây là website được triển khai tự động bằng Microsoft IIS.</textarea>

<div class="tip">Mẹo tốc độ: lần sau các giá trị cũ được giữ lại. Chỉ sửa phần đề bài thay đổi rồi nhấn <b>Ctrl + Enter</b>.</div>

<button id="deployBtn" class="primary" type="submit">⚡ DEPLOY & OPEN ON CLIENT</button>
</form>

<section class="card">
<strong>Kết quả</strong>
<pre id="result">Chưa deploy.</pre>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const fields = ['site','hostname','ip','prefix','httpEnabled','httpPort','httpsEnabled','httpsPort','title','content'];

function saveForm(){
  const data = {};
  for(const id of fields){
    const el = $(id);
    data[id] = el.type === 'checkbox' ? el.checked : el.value;
  }
  localStorage.setItem('iis-fast-form', JSON.stringify(data));
}

function loadForm(){
  try{
    const data = JSON.parse(localStorage.getItem('iis-fast-form') || '{}');
    for(const id of fields){
      if(!(id in data)) continue;
      const el = $(id);
      if(el.type === 'checkbox') el.checked = !!data[id];
      else el.value = data[id];
    }
  }catch{}
}

function payload(){
  return {
    site: $('site').value.trim(),
    hostname: $('hostname').value.trim(),
    ip: $('ip').value.trim(),
    prefix: Number($('prefix').value),
    httpEnabled: $('httpEnabled').checked,
    httpPort: Number($('httpPort').value),
    httpsEnabled: $('httpsEnabled').checked,
    httpsPort: Number($('httpsPort').value),
    title: $('title').value,
    content: $('content').value
  };
}

async function deploy(){
  const out = $('result');
  const btn = $('deployBtn');
  saveForm();

  if(!$('httpEnabled').checked && !$('httpsEnabled').checked){
    throw new Error('Phải bật HTTP, HTTPS hoặc cả hai.');
  }

  btn.disabled = true;
  out.className = '';
  out.textContent = 'Đang deploy…';

  try{
    const r = await fetch('/api/deploy', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload())
    });

    const d = await r.json();
    if(!r.ok || !d.ok) throw new Error(d.message || 'Deploy thất bại.');

    const x = d.deployment;
    out.className = 'ok';
    out.textContent =
`DEPLOY THÀNH CÔNG

Site: ${x.site}
IP: ${x.ip}/${x.prefix}
Hostname: ${x.hostname || '(không dùng)'}
HTTP: ${x.httpEnabled ? x.httpPort + ' / OK' : 'OFF'}
HTTPS: ${x.httpsEnabled ? x.httpsPort + ' / OK' : 'OFF'}
DNS Zone: ${x.dnsZone || '(không dùng)'}
DNS Record: ${x.dnsRecord || '(không dùng)'}

URL ưu tiên:
${x.preferredUrl}

IP URL:
${x.ipUrl || '(không có)'}

Hostname URL:
${x.hostnameUrl || '(không dùng)'}

Client Agent sẽ mở URL ưu tiên bằng Microsoft Edge.`;
  }catch(e){
    out.className = 'error';
    out.textContent = e.message;
  }finally{
    btn.disabled = false;
  }
}

$('deploy').addEventListener('submit', e => {
  e.preventDefault();
  deploy();
});

document.addEventListener('keydown', e => {
  if(e.ctrlKey && e.key === 'Enter'){
    e.preventDefault();
    deploy();
  }
});

for(const id of fields){
  $(id).addEventListener('input', saveForm);
  $(id).addEventListener('change', saveForm);
}

loadForm();
</script>
</body>
</html>
